<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antonia Portfolio</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Antonia</a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="nav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#skills">Skills</a>
            </li>
          </ul>

          <button id="darkToggle" class="btn btn-sm ms-3">
            <i class="bi bi-moon"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-6 hero-text">
            <h1>Hi, Saya <span class="name">Antonia</span></h1>

            <h2>
              Saya adalah <span id="typing"></span>
              <span class="cursor">|</span>
            </h2>

            <p>
              Mahasiswa Teknik Informatika yang tertarik pada Web Development,
              Data Analysis, dan Cyber Security.
            </p>
          </div>

          <div class="col-lg-6 text-center mt-4 mt-lg-0">
            <div class="photo-wrapper">
              <div class="blob"></div>
              <img src="img/foto-nbg2.png" class="profile-img" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section id="skills" class="bg-light">
      <div class="container text-center">
        <h2 class="fw-bold mb-5">Keahlian</h2>

        <div class="row g-4">
          <!-- SKILL ITEM -->
          <div class="col-12 col-md-3">
            <div class="card skill-card">
              <i class="bi bi-code-slash"></i>
              <p>Python, PHP, JavaScript</p>
            </div>
          </div>

          <div class="col-12 col-md-3">
            <div class="card skill-card">
              <i class="bi bi-globe"></i>
              <p>HTML, CSS, Laravel</p>
            </div>
          </div>

          <div class="col-12 col-md-3">
            <div class="card skill-card">
              <i class="bi bi-database"></i>
              <p>MySQL</p>
            </div>
          </div>

          <div class="col-12 col-md-3">
            <div class="card skill-card">
              <i class="bi bi-shield-lock"></i>
              <p>Network Security, Ethical Hacking</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
